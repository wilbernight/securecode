name: securecode
description: >-
  SecureCode — offline, hardware-locked, Ed25519-signed licensing for
  Flutter apps (Android, iOS, macOS). Same serial keys as the SecureCode
  protector; no network, ever.
version: 1.0.0
publish_to: "none"

environment:
  sdk: ">=3.2.0 <4.0.0"
  # sharedDarwinSource (single darwin/ dir for iOS+macOS) needs Flutter 3.27+
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.securecode.securecode
        pluginClass: SecurecodePlugin
      ios:
        pluginClass: SecurecodePlugin
        sharedDarwinSource: true
      macos:
        pluginClass: SecurecodePlugin
        sharedDarwinSource: true
